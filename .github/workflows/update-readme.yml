name: Auto Update README & Comment on Jira

on:
  push:
    branches:
      - main
      - 'IPSFFFS-*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. 自動更新 README.md 內容
      - name: Update README file
        run: |
          echo -e "\n- Activity updated by GitHub Actions on $(date)" >> README.md

      # 2. 自動 Commit 與 Push 回 GitHub
      - name: Commit and Push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md
          git commit -m "docs: auto-update README activity [skip ci]" || echo "No changes to commit"
          git push
